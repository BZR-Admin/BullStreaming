<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <meta name="theme-color" content="#00c6ff" />
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .then(() => console.log("SW registrado ✓"))
          .catch(e => console.warn("SW error:", e));
      });
    }
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cuentas propias | Bull Streaming</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── BUSCADOR DE CLIENTE EN MODAL ── */
    .cliente-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: rgba(10, 12, 28, 0.98);
      border: 1px solid rgba(0,198,255,0.25);
      border-radius: 12px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 9999;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      backdrop-filter: blur(12px);
    }
    .cliente-dropdown.open { display: block; }
    .cliente-option {
      padding: 10px 14px;
      font-size: 13.5px;
      font-weight: 500;
      color: rgba(255,255,255,0.82);
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      transition: background 0.15s;
    }
    .cliente-option:last-child { border-bottom: none; }
    .cliente-option:hover { background: rgba(0,198,255,0.12); color: white; }
    .cliente-option mark {
      background: transparent;
      color: var(--primary);
      font-weight: 700;
    }
    .cliente-empty {
      padding: 12px 14px;
      font-size: 13px;
      color: rgba(255,255,255,0.3);
      text-align: center;
    }
    #addClienteSearch.selected {
      border-color: rgba(0,198,255,0.4) !important;
      color: white;
    }

    /* ── BOOT BLOCK ── */
    .boot-block {
      background: rgba(0,198,255,0.05);
      border: 1px solid rgba(0,198,255,0.15);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .boot-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .boot-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: rgba(255,255,255,0.4);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .boot-value-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }
    .boot-value {
      font-size: 15px;
      font-weight: 700;
      font-family: monospace;
      color: var(--primary);
      letter-spacing: 0.06em;
    }
    .btn-copy {
      background: rgba(0,198,255,0.1);
      border: 1px solid rgba(0,198,255,0.2);
      border-radius: 6px;
      padding: 4px 9px;
      font-size: 13px;
      cursor: pointer;
      color: var(--primary);
      transition: background 0.15s;
      line-height: 1;
      min-height: unset;
      box-shadow: none;
    }
    .btn-copy:hover {
      background: rgba(0,198,255,0.22);
      transform: none;
      box-shadow: none;
    }
    .boot-link {
      font-size: 12px;
      font-weight: 600;
      color: var(--primary);
      text-decoration: none;
      margin-left: auto;
      opacity: 0.75;
      transition: opacity 0.15s;
    }
    .boot-link:hover { opacity: 1; text-decoration: underline; }
  </style>
</head>

<body>

<!-- BOTÓN MENÚ -->
<button id="fab" type="button">☰</button>

<!-- MENÚ -->
<nav id="sideMenu" class="side-menu">
  <button type="button" onclick="location.href='index.html'">🏠 Inicio</button>
  <button type="button" onclick="location.href='ventas.html'">🛒 Ventas</button>
  <button type="button" onclick="location.href='compras.html'">📦 Compras</button>
  <button type="button" onclick="location.href='cuentas.html'">🎬 Cuentas</button>
  <button type="button" onclick="location.href='registros.html'">📊 Registros</button>
  <button type="button" onclick="location.href='clientes_proveedores.html'">👥 Clientes</button>
  <button type="button" onclick="location.href='dashboard.html'">📈 Dashboard</button>
</nav>

<header style="margin-bottom:15px;">
  <h1>Cuentas propias</h1>
</header>

<!-- CONTROLES -->
<div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:15px;">
  <input
    id="search"
    type="text"
    placeholder="Buscar plataforma, correo, proveedor..."
    style="flex:1; padding:10px; border-radius:10px;"
  />
  <select id="filterPlatform" style="padding:10px; border-radius:10px;">
    <option value="">Todas las plataformas</option>
  </select>
  <select id="sortBy" style="padding:10px; border-radius:10px;">
    <option value="fecha_vencimiento">Ordenar por vencimiento</option>
    <option value="disponibilidad">Ordenar por disponibilidad</option>
  </select>
</div>

<!-- CONTENEDOR DE TARJETAS -->
<div id="container"></div>

<!-- MODAL: EDITAR CLIENTE/VENTA -->
<dialog id="modalEditarCliente" class="app-modal">
  <form id="formEditarCliente" method="dialog">
    <h2>Editar cliente de la cuenta</h2>
    <input id="editVentaId" type="hidden" />
    <label for="editPerfil">Nuevo perfil</label>
    <input id="editPerfil" type="text" placeholder="Ejemplo: Bull A" autocomplete="off" required />
    <label for="editFechaVencimiento">Nueva fecha de vencimiento</label>
    <input id="editFechaVencimiento" type="date" required />
    <div class="btn-grid">
      <button type="submit" value="guardar">Guardar cambios</button>
      <button type="button" data-modal-close="modalEditarCliente">Cancelar</button>
    </div>
  </form>
</dialog>

<!-- MODAL: AGREGAR CLIENTE -->
<dialog id="modalAgregarCliente" class="app-modal">
  <form id="formAgregarCliente" method="dialog">
    <h2>Agregar cliente</h2>
    <input id="addCuentaId" type="hidden" />

    <label for="addClienteSearch">Cliente</label>
    <div class="cliente-search-wrap" style="position:relative;">
      <input
        id="addClienteSearch"
        type="text"
        placeholder="Buscar cliente..."
        autocomplete="off"
      />
      <div id="addClienteDropdown" class="cliente-dropdown"></div>
    </div>
    <input id="addCliente" type="hidden" required />

    <label for="addPerfil">Perfil</label>
    <input id="addPerfil" type="text" placeholder="Ejemplo: Bull B" autocomplete="off" required />

    <label for="addFechaVencimiento">Fecha de vencimiento</label>
    <input id="addFechaVencimiento" type="date" required />

    <label for="addGanancia">Ganancia</label>
    <input id="addGanancia" type="number" step="0.01" placeholder="Ej: 5 o 10.50" required />

    <div class="btn-grid">
      <button type="submit" value="guardar">Agregar cliente</button>
      <button type="button" data-modal-close="modalAgregarCliente">Cancelar</button>
    </div>
  </form>
</dialog>

<!-- MODAL: EDITAR VENCIMIENTO DE CUENTA -->
<dialog id="modalEditarCuentaFecha" class="app-modal">
  <form id="formEditarCuentaFecha" method="dialog">
    <h2>Editar vencimiento de cuenta</h2>
    <input id="editCuentaFechaId" type="hidden" />
    <label for="editCuentaFechaVencimiento">Nueva fecha de vencimiento</label>
    <input id="editCuentaFechaVencimiento" type="date" required />
    <div class="btn-grid">
      <button type="submit" value="guardar">Guardar fecha</button>
      <button type="button" data-modal-close="modalEditarCuentaFecha">Cancelar</button>
    </div>
  </form>
</dialog>

<!-- JS PRINCIPAL -->
<script type="module" src="cuentas.js"></script>

<!-- MENU SCRIPT -->
<script>
  const fab  = document.getElementById("fab");
  const menu = document.getElementById("sideMenu");
  fab.onclick = () => {
    menu.style.display = menu.style.display === "flex" ? "none" : "flex";
  };
  document.addEventListener("click", (e) => {
    if (!menu.contains(e.target) && !fab.contains(e.target)) {
      menu.style.display = "none";
    }
  });
</script>

</body>
</html>
